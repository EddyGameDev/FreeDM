name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The whole suite is free to run: no secrets, no paid services.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest

      # The GUI suites skip themselves when there is no display or no Tk.
      - name: Run the test suite
        run: python -m pytest -v

  build:
    name: Build the Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller pillow

      - name: Build FreeDM.exe and FreeDM-cli.exe
        shell: pwsh
        run: ./build.ps1

      - name: Verify the built app
        shell: pwsh
        run: |
          Start-Process -FilePath python `
            -ArgumentList "tests\range_server.py","8765","10" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:FREEDM_HOME = "$env:RUNNER_TEMP\freedm_home"
          # A windowed exe is a GUI program: PowerShell does NOT wait for it,
          # so start it and wait for the process itself.
          $p = Start-Process -FilePath "./dist/FreeDM.exe" -Wait -PassThru `
            -ArgumentList "--selftest","http://127.0.0.1:8765/test.bin",
                          "$env:RUNNER_TEMP\selftest"
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\selftest\selftest_result.txt" -ErrorAction SilentlyContinue
            throw "the frozen build failed its self-test (exit $($p.ExitCode))"
          }
          Get-Content "$env:RUNNER_TEMP\selftest\selftest_result.txt"

          $b = Start-Process -FilePath "./dist/FreeDM.exe" -Wait -PassThru `
            -ArgumentList "--browser-selftest","$env:RUNNER_TEMP\selftest2"
          if ($b.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\selftest2\browser_selftest_result.txt" -ErrorAction SilentlyContinue
            throw "the browser self-test failed (exit $($b.ExitCode))"
          }

          # The console build must print live progress.
          $c = Start-Process -FilePath "./dist/FreeDM-cli.exe" -Wait -PassThru `
            -ArgumentList "http://127.0.0.1:8765/test.bin",
                          "-o","$env:RUNNER_TEMP\clitest","-t","4"
          if ($c.ExitCode -ne 0) { throw "the console build failed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\clitest\test.bin")) {
            throw "the console build downloaded nothing"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup is free. Try the package manager first, then the
          # official installer; if neither works the step is skipped - the
          # tests and the build above are what really matter.
          $iscc = $null
          try {
            choco install innosetup -y --no-progress 2>&1 | Out-Null
          } catch { }
          foreach ($candidate in @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe")) {
            if (Test-Path $candidate) { $iscc = $candidate; break }
          }
          if (-not $iscc) {
            $found = Get-ChildItem "${env:ProgramFiles(x86)}","${env:ProgramFiles}",
                                   "${env:LOCALAPPDATA}\Programs" -Recurse `
                        -Filter "ISCC.exe" -ErrorAction SilentlyContinue |
                        Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not $iscc) {
            Write-Warning "Inno Setup is not available: the installer is skipped."
            exit 0
          }
          Write-Host "Using $iscc"
          & $iscc installer\FreeDM.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not compile" }
          Get-ChildItem dist\FreeDM-Setup-*.exe

      - name: Install it and run the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\FreeDM-Setup-*.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $setup) {
            Write-Warning "No installer was built: the installed-app check is skipped."
            exit 0
          }
          $dir = "$env:RUNNER_TEMP\installed"
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "the installer failed (exit $($p.ExitCode))" }
          foreach ($name in @("FreeDM.exe","FreeDM-cli.exe","LICENSE","NOTICE")) {
            if (-not (Test-Path "$dir\$name")) { throw "the installer did not install $name" }
          }
          # The installed app must work.
          $s = Start-Process -FilePath "$dir\FreeDM.exe" -Wait -PassThru `
            -ArgumentList "--selftest","http://127.0.0.1:8765/test.bin","$env:RUNNER_TEMP\inst"
          if ($s.ExitCode -ne 0) { throw "the installed app failed its self-test" }
          Write-Host "the installed app works"

      - name: Upload the builds
        uses: actions/upload-artifact@v4
        with:
          name: FreeDM-windows
          path: |
            dist/FreeDM.exe
            dist/FreeDM-cli.exe
            dist/FreeDM-Setup-*.exe
          if-no-files-found: warn
